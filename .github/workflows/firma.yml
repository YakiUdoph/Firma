name: FIRMA verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portaldot-investigation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portaldot-investigation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  live-portaldot-v3:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: portaldot-investigation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portaldot-investigation/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node bin/firma.mjs --json --output evidence/ci-live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firma-live-evidence
          path: portaldot-investigation/evidence/ci-live.json
